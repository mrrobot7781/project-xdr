apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-app
  template:
    metadata:
      labels:
        app: employee-app
    spec:
      containers:
      - name: employee-app
        image: docker.io/mrrobot7781/astra-xdr-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: employee-app-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: employee-app
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30080
