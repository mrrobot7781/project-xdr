apiVersion: apps/v1
kind: Deployment
metadata:
  name: astra-xdr-dashboard
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: astra-xdr-dashboard
  template:
    metadata:
      labels:
        app: astra-xdr-dashboard
    spec:
      serviceAccountName: astra-dashboard-sa
      containers:
      - name: dashboard
        image: docker.io/mrrobot7781/astra-xdr-dashboard:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: astra-xdr-dashboard-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: astra-xdr-dashboard
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30081
