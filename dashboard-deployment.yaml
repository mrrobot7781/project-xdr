apiVersion: apps/v1
kind: Deployment
metadata:
  name: astra-xdr-dashboard
  namespace: default
  labels:
    app: astra-xdr-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: astra-xdr-dashboard
  template:
    metadata:
      labels:
        app: astra-xdr-dashboard
    spec:
      terminationGracePeriodSeconds: 5
      serviceAccountName: astra-dashboard-sa
      containers:
        - name: astra-xdr-dashboard
          image: docker.io/mrrobot7781/astra-xdr-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          # 👇 Trivy JSON ko read karne ke liye Volume Mount 👇
          volumeMounts:
            - name: trivy-data
              mountPath: /app/data
      # 👇 EC2 Host se data uthane ka rasta 👇
      volumes:
        - name: trivy-data
          hostPath:
            path: /home/ubuntu/project-xdr
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: astra-xdr-dashboard-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: astra-xdr-dashboard
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30081
