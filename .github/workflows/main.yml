dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: docker-build-push  # Ensure this runs after docker build/push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Run Application Locally
        run: |
          docker build -t test-app .
          docker run -d -p 5000:5000 --name running-app test-app
          sleep 5

      - name: Fix Workspace Directory Permissions
        run: sudo chmod -R 777 .

      - name: Run OWASP ZAP DAST Scan
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw --network=host -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:5000 -J report_json.json -w report_md.md -r report_html.html || true

      - name: Stop Running Container
        if: always()
        run: docker stop running-app || true

      - name: Upload ZAP DAST Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-security-report
          path: |
            report_html.html
            report_md.md
            report_json.json
