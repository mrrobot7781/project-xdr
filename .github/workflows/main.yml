dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build and Run Application Locally
        run: |
          docker build -t test-app .
          docker run -d -p 5000:5000 --name running-app test-app
          sleep 5  # Container ko fully boot up hone ka time dene ke liye

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000'
          issue_title: 'ZAP DAST Vulnerability Report'
          fail_action: false # High risks par pipeline fail karni ho toh true kar sakte ho

      - name: Stop Running Container
        if: always()
        run: docker stop running-app || true
