name: Deploy Project XDR to EC2 via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest # Runs on GitHub's free cloud servers

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 54.83.90.238
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/project-xdr
            git pull origin main

            # Apply Kubernetes Resources
            kubectl apply -f rbac.yaml
            kubectl apply -f deployment.yaml
            kubectl apply -f dashboard-deployment.yaml
            kubectl apply -f k8s/employee-app.yaml

            # Restart Port-Forwarding
            pkill -9 -f "port-forward" || true
            nohup kubectl port-forward --address 0.0.0.0 svc/employee-app-service 30082:5000 >/dev/null 2>&1 &
            nohup kubectl port-forward --address 0.0.0.0 svc/astra-xdr-dashboard-service 30081:5000 >/dev/null 2>&1 &
