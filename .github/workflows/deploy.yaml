name: Deploy Project XDR to EC2 via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 54.83.90.238
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            export KUBECONFIG=/home/ubuntu/.kube/config
            cd ~/project-xdr

            # Pull latest code
            git pull origin main

            # Check minikube health - auto heal if stopped/unhealthy
            if ! minikube status | grep -q "Running"; then
              echo "Minikube unhealthy. Resetting cluster..."
              minikube delete --all --purge || true
              minikube start --driver=docker
            fi
            minikube update-context

            # Apply all Kubernetes manifests
            kubectl apply -f rbac.yaml
            kubectl apply -f deployment.yaml
            kubectl apply -f dashboard-deployment.yaml
            kubectl apply -f k8s/employee-app.yaml

            # Restart deployments using the CORRECT resource names
            kubectl rollout restart deployment/employee-app-deployment
            kubectl rollout restart deployment/astra-xdr-dashboard-deployment

            # Wait for rollouts to finish
            kubectl rollout status deployment/employee-app-deployment --timeout=60s || true
            kubectl rollout status deployment/astra-xdr-dashboard-deployment --timeout=60s || true

            # Clear stale listeners & restart background port forwarding
            sudo fuser -k 30081/tcp || true
            sudo fuser -k 30082/tcp || true
            pkill -9 -f "port-forward" || true
            sleep 2

            nohup kubectl port-forward --address 0.0.0.0 svc/employee-app-service 30082:5000 >/dev/null 2>&1 &
            nohup kubectl port-forward --address 0.0.0.0 svc/astra-xdr-dashboard-service 30081:5000 >/dev/null 2>&1 &

            sleep 3
            curl -I http://localhost:30082
