name: ASTRA-XDR CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Unit Testing & Coverage
  # -------------------------------------------------------------
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest --cov=. --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # -------------------------------------------------------------
  # Job 2: SonarQube Static Analysis (SAST)
  # -------------------------------------------------------------
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
        with:
          args: >
            -Dsonar.projectKey=xdr-project
            -Dsonar.organization=double-script
            -Dsonar.sources=.
            -Dsonar.python.coverage.reportPaths=coverage.xml

  # -------------------------------------------------------------
  # Job 3: Build, Scan & Push Docker Image to Docker Hub
  # -------------------------------------------------------------
  docker-build-push:
    name: Build, Scan & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [unit-tests, sonarqube]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Employee Image
        run: |
          docker build \
          -f Dockerfile \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr-app:${{ github.sha }} \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr-app:latest \
          .
      - name: Build Dashboard Image
        run: |
          docker build \
          -f Dockerfile.dashboard \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/astra-dashboard:${{ github.sha }} \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/astra-dashboard:latest \
          .

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr-app:${{ github.sha }}'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'
          severity: 'MEDIUM,HIGH,CRITICAL'

      - name: Upload Trivy Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-results.json

      - name: Push Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/astra-dashboard:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/astra-dashboard:latest

  # -------------------------------------------------------------
  # Job 4: DAST Scan via Direct Docker Container (Bypasses Broken Action)
  # -------------------------------------------------------------
  dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Run Application Locally
        run: |
          docker build -t test-app .
          docker run -d -p 5000:5000 --name running-app test-app
          sleep 5

      - name: Fix Workspace Directory Permissions
        run: sudo chmod -R 777 .

      - name: Run OWASP ZAP DAST Scan
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw --network=host -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:5000 -J report_json.json -w report_md.md -r report_html.html || true

      - name: Stop Running Container
        if: always()
        run: docker stop running-app || true

      - name: Upload ZAP DAST Security Report (v4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-security-report
          path: |
            report_html.html
            report_md.md
            report_json.json

  # -------------------------------------------------------------
  # Job 5: Continuous Deployment to Kubernetes
  # -------------------------------------------------------------
  cd-deploy-k8s:
    name: Continuous Deployment to Kubernetes
    needs: dast-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Download Trivy Artifact
        uses: actions/download-artifact@v4
        with:
          name: trivy-security-report

      - name: Copy Trivy Report to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "trivy-results.json"
          target: "/home/ubuntu/project-xdr/"

      - name: Execute SSH commands
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export KUBECONFIG=/home/ubuntu/.kube/config

            cd /home/ubuntu/project-xdr

            git pull origin main

            kubectl apply -f rbac.yaml
            kubectl apply -f deployment.yaml
            kubectl apply -f dashboard-deployment.yaml
            kubectl apply -f k8s/employee-app.yaml

            # Fixed Hardcoded Docker Hub Username
            docker pull mrrobot7781/astra-xdr-app:latest || true
            docker pull mrrobot7781/astra-dashboard:latest || true

            kubectl rollout restart deployment/employee-app
            kubectl rollout restart deployment/astra-xdr-dashboard

            # Non-blocking status check (Prevents CI/CD crashes if pod is slow)
            kubectl rollout status deployment/employee-app --timeout=30s || true
            kubectl rollout status deployment/astra-xdr-dashboard --timeout=30s || true

            echo "Waiting for rollout..."
            sleep 30

            chmod +x /home/ubuntu/start-port-forward.sh
            sudo systemctl restart xdr-portforward

            sleep 10

            echo "===== SERVICE STATUS ====="
            sudo systemctl status xdr-portforward --no-pager

            echo "===== PORTS ====="
            sudo ss -tulpn | grep 30081 || true
            sudo ss -tulpn | grep 30082 || true

            echo "===== DASHBOARD LOG ====="
            cat /tmp/pf-dashboard.log || true

            echo "===== EMPLOYEE LOG ====="
            cat /tmp/pf-employee.log || true
