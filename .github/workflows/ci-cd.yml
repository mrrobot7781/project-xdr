name: ASTRA-XDR CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Unit Testing & Coverage
  # -------------------------------------------------------------
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest --cov=. --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # -------------------------------------------------------------
  # Job 2: SonarQube Static Analysis (SAST)
  # -------------------------------------------------------------
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
        with:
          args: >
            -Dsonar.projectKey=mrrobot7781_project-xdr
            -Dsonar.organization=mrrobot7781
            -Dsonar.sources=.
            -Dsonar.python.coverage.reportPaths=coverage.xml

  # -------------------------------------------------------------
  # Job 3: Build, Scan & Push Docker Image to Docker Hub
  # -------------------------------------------------------------
  docker-build-push:
    name: Build, Scan & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [unit-tests, sonarqube]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image locally for Scanning
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr-app:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr-app:latest .

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr-app:${{ github.sha }}'
          format: 'table'
          output: 'trivy-report.txt'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt

      - name: Push Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr-app:latest

  # -------------------------------------------------------------
  # Job 4: DAST Scan using OWASP ZAP
  # -------------------------------------------------------------
  dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Run Application Locally
        run: |
          docker build -t test-app .
          docker run -d -p 5000:5000 --name running-app test-app
          sleep 5

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000'
          issue_title: 'ZAP DAST Vulnerability Report'
          fail_action: false

      - name: Stop Running Container
        if: always()
        run: docker stop running-app || true

  # -------------------------------------------------------------
  # Job 5: Continuous Deployment to Kubernetes
  # -------------------------------------------------------------
  cd-deploy-k8s:
    name: Continuous Deployment to Kubernetes
    needs: dast-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Kubeconfig / SSH to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/main/k8s/employee-app.yaml
            kubectl rollout restart deployment/employee-app
