name: ASTRA-XDR CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Unit Testing & Coverage
  # -------------------------------------------------------------
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest --cov=. --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # -------------------------------------------------------------
  # Job 2: SonarQube Static Analysis
  # -------------------------------------------------------------
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
        with:
          args: >
            -Dsonar.projectKey=mrrobot7781_project-xdr
            -Dsonar.organization=mrrobot7781
            -Dsonar.sources=.
            -Dsonar.python.coverage.reportPaths=coverage.xml

# -------------------------------------------------------------
  # Job 3: Build, Scan & Push Docker Image to Docker Hub
  # -------------------------------------------------------------
  docker-build-push:
    name: Build, Scan & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [unit-tests, sonarqube]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Docker Hub me Login karo
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Buildx setup karo
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Local build karo scanning ke liye
      - name: Build Docker Image locally for Scanning
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr-app:${{ github.sha }} .

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr-app:${{ github.sha }}'
          format: 'table'
          output: 'trivy-report.txt'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt


  cd-deploy-k8s:
    name: Continuous Deployment to Kubernetes
    needs: [dast-scan] # Runs after security scans complete
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Kubeconfig / SSH to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull latest k8s manifest changes and force rollout update
            kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/main/k8s/employee-app.yaml
            kubectl rollout restart deployment/employee-app
